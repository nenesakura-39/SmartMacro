<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:#05070D}
.bg{position:absolute;inset:0;background:
 radial-gradient(520px 520px at 50% 46%, rgba(124,58,237,.62), transparent 70%),
 radial-gradient(380px 380px at 40% 56%, rgba(56,189,248,.26), transparent 70%),
 linear-gradient(160deg,#0B1022 0%,#05070D 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(56,189,248,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.07) 1px,transparent 1px);background-size:64px 64px;
 -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 25%,transparent 62%)}
.ring{position:absolute;left:50%;top:50%;width:860px;height:860px;transform:translate(-50%,-50%);border-radius:50%;
 box-shadow:inset 0 0 0 3px rgba(129,140,248,.18)}
.mark{position:absolute;left:50%;top:50%;width:700px;height:700px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 40px rgba(168,85,247,.35))}
</style></head><body><div class="bg"></div><div class="grid"></div><div class="ring"></div><img class="mark" src="../kurologic-mark.svg"></body></html>
