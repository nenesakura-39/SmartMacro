<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:680px;height:240px;overflow:hidden;background:#05070D}
.bg{position:absolute;inset:0;background:
 radial-gradient(420px 180px at 50% 52%, rgba(109,40,217,.32), transparent 70%),
 radial-gradient(300px 160px at 38% 56%, rgba(56,189,248,.16), transparent 70%),
 linear-gradient(180deg,#070A14,#05070D)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(56,189,248,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.06) 1px,transparent 1px);background-size:30px 30px;
 -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 50%,#000 30%,transparent 85%)}
.logo{position:absolute;left:50%;top:50%;width:520px;transform:translate(-50%,-50%)}
</style></head><body><div class="bg"></div><div class="grid"></div><img class="logo" src="../kurologic-logo.svg"></body></html>
