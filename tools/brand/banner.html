<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#05070D;}
.bg{position:absolute;inset:0;background:
 radial-gradient(900px 520px at 50% 46%, rgba(109,40,217,.28), transparent 70%),
 radial-gradient(700px 420px at 38% 52%, rgba(56,189,248,.16), transparent 70%),
 linear-gradient(180deg,#070A14 0%,#05070D 100%);}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(56,189,248,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.06) 1px,transparent 1px);background-size:64px 64px;
 -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 50%,#000 30%,transparent 80%);}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);width:1316px;}
.foot{position:absolute;bottom:64px;width:100%;text-align:center;font:500 24px Inter,sans-serif;letter-spacing:6px;color:#475569}
</style></head><body><div class="bg"></div><div class="grid"></div>
<img class="logo" src="kurologic-logo.svg"><div class="foot">DEVELOPED BY RIKU (リク)</div></body></html>
