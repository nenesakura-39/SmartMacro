<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- KuroLogic mark: an obsidian hexagon ("kuro" = black) holding a circuit-node "K" (logic). -->
  <defs>
    <linearGradient id="kl-hex" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#141A2E"/>
      <stop offset="0.55" stop-color="#090D18"/>
      <stop offset="1" stop-color="#04060C"/>
    </linearGradient>
    <radialGradient id="kl-core" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6D28D9" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#1E3A8A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kl-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="kl-bar" gradientUnits="userSpaceOnUse" x1="0" y1="76" x2="0" y2="180">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="kl-arm" gradientUnits="userSpaceOnUse" x1="104" y1="70" x2="169" y2="190">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="kl-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="kl-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="kl-clip"><path d="M128,14 L226,70 Q232,74 232,81 L232,175 Q232,182 226,186 L128,242 Q128,242 128,242 L30,186 Q24,182 24,175 L24,81 Q24,74 30,70 Z"/></clipPath>
  </defs>

  <!-- Obsidian hexagon -->
  <path d="M121,17 Q128,13 135,17 L223,67 Q230,71 230,79 L230,177 Q230,185 223,189 L135,239 Q128,243 121,239 L33,189 Q26,185 26,177 L26,79 Q26,71 33,67 Z" fill="url(#kl-hex)"/>
  <g clip-path="url(#kl-clip)">
    <rect width="256" height="256" fill="url(#kl-core)"/>
    <!-- faint circuit traces -->
    <g stroke="#38BDF8" stroke-opacity="0.10" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M26,110 H60 L72,98"/>
      <path d="M230,148 H200 L188,160"/>
      <path d="M128,242 V214"/>
      <path d="M128,14 V40"/>
    </g>
    <!-- glow behind the K -->
    <g filter="url(#kl-soft)" opacity="0.75">
      <path d="M94,76 V180 M106,128 L160,74 M120,132 L164,182" stroke="#7C3AED" stroke-width="22" stroke-linecap="round" fill="none"/>
    </g>
  </g>
  <!-- Edge -->
  <path d="M121,17 Q128,13 135,17 L223,67 Q230,71 230,79 L230,177 Q230,185 223,189 L135,239 Q128,243 121,239 L33,189 Q26,185 26,177 L26,79 Q26,71 33,67 Z" fill="none" stroke="url(#kl-edge)" stroke-width="3"/>
  <path d="M122,24 Q128,21 134,24 L218,72 Q223,75 223,81 L223,175 Q223,181 218,184 L134,232 Q128,235 122,232 L38,184 Q33,181 33,175 L33,81 Q33,75 38,72 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- The K: titanium spine + two neon logic arms ending in circuit nodes -->
  <g filter="url(#kl-glow)">
    <path d="M94,76 V180" stroke="url(#kl-bar)" stroke-width="20" stroke-linecap="round"/>
    <path d="M108,126 L154,80" stroke="url(#kl-arm)" stroke-width="16" stroke-linecap="round"/>
    <path d="M122,134 L158,176" stroke="url(#kl-arm)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="165" cy="69" r="11" fill="#0A0E1A" stroke="#38BDF8" stroke-width="5"/>
    <circle cx="165" cy="69" r="4" fill="#E0F2FE"/>
    <circle cx="168" cy="187" r="11" fill="#0A0E1A" stroke="#C084FC" stroke-width="5"/>
    <circle cx="168" cy="187" r="4" fill="#F5E8FF"/>
  </g>
  <!-- junction node -->
  <circle cx="108" cy="128" r="6" fill="#FFFFFF"/>
</svg>
