<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="340">
  <defs>
    <linearGradient id="layerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== LAYER 1: REFLEX, CLI & CONTEXT ROUTER ==================== -->
  <rect x="12" y="10" width="896" height="90" rx="12" fill="url(#layerBg)" stroke="#22d3ee" stroke-width="1.6" />
  <text x="28" y="32" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#67e8f9">
    ⚡ LAYER 1 · REFLEX, CLI &amp; CONTEXT ROUTER (HOW MACROS START)
  </text>

  <!-- 4 Cards in Layer 1 -->
  <rect x="26" y="42" width="208" height="46" rx="7" fill="#0f172a" stroke="#0891b2" stroke-width="1.2" />
  <text x="130" y="61" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">🎹 Scoped Global Hotkeys</text>
  <text x="130" y="77" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#67e8f9">Once · Hold · Repeat · Toggle</text>

  <rect x="246" y="42" width="208" height="46" rx="7" fill="#0f172a" stroke="#0891b2" stroke-width="1.2" />
  <text x="350" y="61" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">🕒 Schedules &amp; Window Events</text>
  <text x="350" y="77" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#67e8f9">Startup · Interval · App Focused</text>

  <rect x="466" y="42" width="208" height="46" rx="7" fill="#0f172a" stroke="#0891b2" stroke-width="1.2" />
  <text x="570" y="61" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">💻 Single-Instance CLI IPC</text>
  <text x="570" y="77" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#67e8f9">--run "Name" · --list · --tray</text>

  <rect x="686" y="42" width="208" height="46" rx="7" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" />
  <text x="790" y="61" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ecfeff">🚦 Run Governor &amp; Profiles</text>
  <text x="790" y="77" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#22d3ee">Ignore · Queue · Preempt</text>

  <!-- Animated Data Flow Lines Layer 1 -> Layer 2 -->
  <line x1="280" y1="100" x2="280" y2="122" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 3" />
  <line x1="640" y1="100" x2="640" y2="122" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 3" />
  <circle cx="280" cy="111" r="4" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="cy" values="100;122;100" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="640" cy="111" r="4" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="cy" values="100;122;100" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== LAYER 2: STUDIO X WORKFLOW IDE ==================== -->
  <rect x="12" y="122" width="896" height="90" rx="12" fill="url(#layerBg)" stroke="#a855f7" stroke-width="1.6" />
  <text x="28" y="144" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#d8b4fe">
    🎛 LAYER 2 · STUDIO X WORKFLOW IDE (BUILD, POLISH, DEBUG &amp; AUDIT)
  </text>

  <!-- 4 Cards in Layer 2 -->
  <rect x="26" y="154" width="208" height="46" rx="7" fill="#0f172a" stroke="#9333ea" stroke-width="1.2" />
  <text x="130" y="173" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">🧰 Toolbox &amp; 10 Blueprints</text>
  <text x="130" y="189" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#d8b4fe">+ Shared Template Gallery</text>

  <rect x="246" y="154" width="208" height="46" rx="7" fill="#0f172a" stroke="#9333ea" stroke-width="1.2" />
  <text x="350" y="173" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">🧱 Collapsible Block Canvas</text>
  <text x="350" y="189" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#d8b4fe">Groups · ✨ Polish · ✂ Expand Drag</text>

  <rect x="466" y="154" width="208" height="46" rx="7" fill="#0f172a" stroke="#9333ea" stroke-width="1.2" />
  <text x="570" y="173" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">🐞 Call-Stack Debugger 2.0</text>
  <text x="570" y="189" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#d8b4fe">F9 Break · F10 Over · F11 Into</text>

  <rect x="686" y="154" width="208" height="46" rx="7" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
  <text x="790" y="173" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#faf5ff">🛰 Mission Control &amp; Audit</text>
  <text x="790" y="189" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#c084fc">Live HUD (Ctrl+M) · Health Scan</text>

  <!-- Animated Data Flow Lines Layer 2 <-> Layer 3 -->
  <line x1="280" y1="212" x2="280" y2="234" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" />
  <line x1="640" y1="212" x2="640" y2="234" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" />
  <circle cx="280" cy="223" r="4" fill="#10b981" filter="url(#glow)">
    <animate attributeName="cy" values="212;234;212" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="640" cy="223" r="4" fill="#a855f7" filter="url(#glow)">
    <animate attributeName="cy" values="234;212;234" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== LAYER 3: SMARTMACRO.CORE ENGINE ==================== -->
  <rect x="12" y="234" width="896" height="96" rx="12" fill="url(#layerBg)" stroke="#10b981" stroke-width="1.6" />
  <text x="28" y="256" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#6ee7b7">
    🚀 LAYER 3 · SMARTMACRO.CORE ENGINE (PLAYBACK, INPUT, VISION 2.0 &amp; SERVO)
  </text>

  <!-- 5 Cards in Layer 3 -->
  <rect x="24" y="266" width="166" height="50" rx="7" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
  <text x="107" y="286" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">🧭 5-Tier Smart Intent</text>
  <text x="107" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#6ee7b7">UIA → OCR → Img → Win</text>

  <rect x="200" y="266" width="166" height="50" rx="7" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
  <text x="283" y="286" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">🖱 Closed-Loop Drag</text>
  <text x="283" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#6ee7b7">Stepped Relative + Shift</text>

  <rect x="376" y="266" width="168" height="50" rx="7" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
  <text x="460" y="286" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">👁 Vision 2.0 + SIMD FFT</text>
  <text x="460" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#6ee7b7">WGC · Occlusion · Kalman</text>

  <rect x="554" y="266" width="166" height="50" rx="7" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
  <text x="637" y="286" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">🧠 Brain 2.0 + WASAPI</text>
  <text x="637" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#6ee7b7">Vars · Audio · Watchers</text>

  <rect x="730" y="266" width="166" height="50" rx="7" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="813" y="286" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#ecfdf5">⚖️ 120 Hz PD Servo</text>
  <text x="813" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#10b981">Velocity Brake + PWM</text>
</svg>
