<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 14" width="100%" height="14">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0" />
      <stop offset="25%" stop-color="#22d3ee" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <filter id="pulseGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <line x1="0" y1="7" x2="920" y2="7" stroke="url(#divGrad)" stroke-width="1.5" />

  <circle cx="460" cy="7" r="3" fill="#22d3ee" filter="url(#pulseGlow)">
    <animate attributeName="cx" values="120;800;120" dur="6.5s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#22d3ee;#a855f7;#10b981;#22d3ee" dur="6.5s" repeatCount="indefinite" />
  </circle>
</svg>
