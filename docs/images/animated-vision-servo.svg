<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 186" width="100%" height="186">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LEFT PANEL: VISION 2.0 OCCLUSION GRID + KALMAN PREDICTION -->
  <rect x="12" y="10" width="440" height="166" rx="12" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.5" />
  <text x="28" y="34" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#d8b4fe">
    👁 VISION 2.0: 3×3 OCCLUSION GRID + KALMAN LEAD
  </text>

  <!-- Moving Target + 3x3 Sub-Patch Grid + Lead Crosshair -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 76,-8; 0,0"
                      dur="4.4s" repeatCount="indefinite" />

    <!-- 3x3 Sub-Patch Grid (6 visible green patches, 3 occluded rose patches) -->
    <g transform="translate(52, 54)">
      <!-- Row 1 -->
      <rect x="0"  y="0"  width="24" height="24" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-width="1.2" />
      <rect x="26" y="0"  width="24" height="24" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-width="1.2" />
      <rect x="52" y="0"  width="24" height="24" fill="#f43f5e" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1.2" />
      <!-- Row 2 -->
      <rect x="0"  y="26" width="24" height="24" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-width="1.2" />
      <rect x="26" y="26" width="24" height="24" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-width="1.2" />
      <rect x="52" y="26" width="24" height="24" fill="#f43f5e" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1.2" />
      <!-- Row 3 -->
      <rect x="0"  y="52" width="24" height="24" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-width="1.2" />
      <rect x="26" y="52" width="24" height="24" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-width="1.2" />
      <rect x="52" y="52" width="24" height="24" fill="#f43f5e" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1.2" />

      <!-- Occluding Particle Cloud on Right Edge -->
      <circle cx="68" cy="22" r="14" fill="#a855f7" opacity="0.38" />
      <circle cx="62" cy="54" r="16" fill="#ec4899" opacity="0.32" />
    </g>

    <!-- Kalman Velocity Vector Arrow -->
    <line x1="90" y1="92" x2="188" y2="92" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 3" />

    <!-- Predictive Lead Crosshair -->
    <g transform="translate(194, 92)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="#22d3ee" stroke-width="1.8" filter="url(#glow)">
        <animate attributeName="r" values="8;13;8" dur="1.1s" repeatCount="indefinite" />
      </circle>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#22d3ee" stroke-width="1.4" />
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#22d3ee" stroke-width="1.4" />
      <circle cx="0" cy="0" r="3" fill="#22d3ee" />
      <text x="18" y="-4" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#67e8f9">Lead Click (+60ms)</text>
      <text x="18" y="10" font-family="Consolas, monospace" font-size="9.5" fill="#10b981">6/9 Patches · 94% Match</text>
    </g>
  </g>

  <text x="28" y="158" font-family="Consolas, monospace" font-size="10.5" fill="#94a3b8">
    SIMD AVX2 FFT + Sub-Patch Grid + 2D Kalman Velocity Filter (px/s)
  </text>

  <!-- RIGHT PANEL: 120 Hz PREDICTIVE PD MINIGAME SERVO -->
  <rect x="468" y="10" width="440" height="166" rx="12" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5" />
  <text x="484" y="34" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fde68a">
    ⚖️ 120 Hz PREDICTIVE PD MINIGAME SERVO (MOMENTUM BAR)
  </text>

  <!-- Minigame Gauge Track -->
  <rect x="488" y="64" width="400" height="38" rx="10" fill="#090d16" stroke="#334155" stroke-width="1.5" />

  <!-- Controlled Catch Zone Bar (Tracks the target smoothly with braking) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 178,0; 36,0; 148,0; 0,0"
                      keyTimes="0; 0.32; 0.62; 0.85; 1"
                      dur="5.2s" repeatCount="indefinite" />
    <rect x="506" y="68" width="112" height="30" rx="7" fill="#10b981" fill-opacity="0.26" stroke="#10b981" stroke-width="2" />
    <text x="562" y="87" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" font-weight="700" fill="#6ee7b7">CATCH ZONE</text>
  </g>

  <!-- Moving Target Icon inside Gauge -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 182,0; 32,0; 152,0; 0,0"
                      keyTimes="0; 0.30; 0.60; 0.83; 1"
                      dur="5.2s" repeatCount="indefinite" />
    <circle cx="562" cy="83" r="10" fill="#f59e0b" filter="url(#glow)" />
    <circle cx="562" cy="83" r="4" fill="#fef3c7" />
  </g>

  <!-- Live PD Telemetry Badges -->
  <rect x="488" y="114" width="126" height="24" rx="5" fill="#0f172a" stroke="#1e293b" />
  <text x="551" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#6ee7b7">● LOCKED 120 Hz</text>

  <rect x="624" y="114" width="132" height="24" rx="5" fill="#0f172a" stroke="#1e293b" />
  <text x="690" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#67e8f9">Brake Dist: v²/2a</text>

  <rect x="766" y="114" width="122" height="24" rx="5" fill="#0f172a" stroke="#1e293b" />
  <text x="827" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#fcd34d">PWM Hover: ON</text>

  <text x="484" y="158" font-family="Consolas, monospace" font-size="10.5" fill="#94a3b8">
    Presets: 🧲 Momentum Bar · ⬇️ Gravity Bar · ⚡ Snap Bar · 🍃 Floaty Bar
  </text>
</svg>
