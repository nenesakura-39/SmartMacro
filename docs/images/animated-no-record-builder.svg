<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 264" width="100%" height="264">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- COLUMN 1: TOOLBOX & BLUEPRINTS -->
  <rect x="12" y="10" width="272" height="244" rx="12" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.5" />
  <text x="26" y="34" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#d8b4fe">
    🧰 1. PICK BLOCKS OR BLUEPRINTS
  </text>

  <!-- Toolbox Pills -->
  <rect x="26" y="46" width="244" height="30" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="36" y="65" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#67e8f9">👁 Find Image / Text / Color</text>
  <text x="258" y="65" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#22d3ee">+ Add</text>

  <rect x="26" y="82" width="244" height="30" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="36" y="101" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">🖱 Click / Drag / Key / Type Text</text>
  <text x="258" y="101" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#10b981">+ Add</text>

  <rect x="26" y="118" width="244" height="30" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="36" y="137" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#d8b4fe">🔀 If / Else · Repeat · Group</text>
  <text x="258" y="137" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#c084fc">+ Add</text>

  <rect x="26" y="154" width="244" height="30" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="36" y="173" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#f9a8d4">🧠 Set Variable · Audio · Webhook</text>
  <text x="258" y="173" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#ec4899">+ Add</text>

  <rect x="26" y="190" width="244" height="30" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="36" y="209" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#fde68a">⚡ 10 Ready-Made Blueprints</text>
  <text x="258" y="209" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#f59e0b">1-Click</text>

  <text x="26" y="240" font-family="Consolas, monospace" font-size="10" fill="#94a3b8">
    Or press Ctrl+K to search any block!
  </text>

  <!-- Animated Connector 1 -> 2 -->
  <circle cx="294" cy="132" r="4" fill="#a855f7" filter="url(#glow)">
    <animate attributeName="cx" values="286;304;286" dur="1.6s" repeatCount="indefinite" />
  </circle>

  <!-- COLUMN 2: VISUAL LEGO WORKFLOW STACK (NO RECORDING!) -->
  <rect x="308" y="10" width="324" height="244" rx="12" fill="url(#cardBg)" stroke="#22d3ee" stroke-width="1.5" />
  <text x="322" y="34" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#67e8f9">
    🧱 2. SNAP BLOCKS LIKE LEGO (0s RECORDING)
  </text>

  <!-- Animated Step Execution Cursor Highlight -->
  <rect x="322" y="46" width="296" height="30" rx="6" fill="#22d3ee" opacity="0.16">
    <animate attributeName="y" values="46;82;118;154;190;46" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="5.5s" repeatCount="indefinite" />
  </rect>

  <!-- Block 1: Repeat Loop -->
  <rect x="322" y="46" width="296" height="30" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
  <rect x="322" y="46" width="5" height="30" rx="2" fill="#a855f7" />
  <text x="336" y="65" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#e9d5ff">🔁 Repeat 25 times (or Until Found)</text>

  <!-- Left Rail for Loop Children -->
  <line x1="332" y1="78" x2="332" y2="216" stroke="#a855f7" stroke-width="2" opacity="0.6" />

  <!-- Block 2: Find Image -->
  <rect x="342" y="82" width="276" height="30" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2" />
  <rect x="342" y="82" width="5" height="30" rx="2" fill="#22d3ee" />
  <text x="356" y="101" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#cffafe">👁 Find Image "Claim_Reward.png"</text>

  <!-- Block 3: Click Last Found -->
  <rect x="342" y="118" width="276" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
  <rect x="342" y="118" width="5" height="30" rx="2" fill="#10b981" />
  <text x="356" y="137" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#d1fae5">🖱 Click on Last Found Spot (+0, +0)</text>

  <!-- Block 4: Set Variable -->
  <rect x="342" y="154" width="276" height="30" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" />
  <rect x="342" y="154" width="5" height="30" rx="2" fill="#ec4899" />
  <text x="356" y="173" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#fce7f3">🧠 Add +1 to Variable {claimed}</text>

  <!-- Block 5: Smart Wait -->
  <rect x="342" y="190" width="276" height="30" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
  <rect x="342" y="190" width="5" height="30" rx="2" fill="#f59e0b" />
  <text x="356" y="209" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#fef3c7">⏱ Wait Until Screen Settles (Smart)</text>

  <text x="322" y="240" font-family="Consolas, monospace" font-size="10" fill="#94a3b8">
    Drag to reorder · Space to mute · Ctrl+G to group
  </text>

  <!-- Animated Connector 2 -> 3 -->
  <circle cx="642" cy="132" r="4" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="cx" values="634;652;634" dur="1.6s" repeatCount="indefinite" />
  </circle>

  <!-- COLUMN 3: INTERACTIVE SCREEN PICKERS & LIVE TEST -->
  <rect x="656" y="10" width="252" height="244" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" />
  <text x="670" y="34" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#6ee7b7">
    🎯 3. POINT, SNIP &amp; TEST LIVE
  </text>

  <!-- Tool 1 -->
  <rect x="670" y="48" width="224" height="40" rx="6" fill="#0f172a" stroke="#1e293b" />
  <text x="680" y="65" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">🎯 Pick Position Crosshair</text>
  <text x="680" y="80" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Click anywhere on screen to grab X/Y</text>

  <!-- Tool 2 -->
  <rect x="670" y="96" width="224" height="40" rx="6" fill="#0f172a" stroke="#1e293b" />
  <text x="680" y="113" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">📸 Snip Image / OCR Region</text>
  <text x="680" y="128" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Drag a box on screen to capture target</text>

  <!-- Tool 3 -->
  <rect x="670" y="144" width="224" height="40" rx="6" fill="#0f172a" stroke="#1e293b" />
  <text x="680" y="161" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">🎹 1-Tap Hardware Key Bind</text>
  <text x="680" y="176" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Press any key to capture ScanCode + VK</text>

  <!-- Tool 4 -->
  <rect x="670" y="192" width="224" height="44" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
  <text x="680" y="210" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ecfdf5">🧪 Test Step Instantly (Ctrl+T)</text>
  <text x="680" y="226" font-family="Consolas, monospace" font-size="10" fill="#6ee7b7">✓ Found in 11ms (98.4% match)</text>
</svg>
